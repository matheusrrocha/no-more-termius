[package]
name = "no-more-termius"
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
description = "Keyboard-driven TUI to manage and open SSH connections, with a dual-pane SFTP browser"
authors = ["Matheus Rocha"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/matheusrrocha/no-more-termius"
homepage = "https://github.com/matheusrrocha/no-more-termius"
keywords = ["ssh", "tui", "sftp", "terminal", "ratatui"]
categories = ["command-line-utilities", "network-programming"]
exclude = [".github/", ".claude-plugin/", "claude-plugin/", "docs/", "packaging/"]

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "6.0.0"
fuzzy-matcher = "0.3.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "tiff"] }
ratatui = "0.30.2"
serde = { version = "1.0.228", features = ["derive"] }
ssh2 = "0.9.6"
toml = "1.1.2"
zeroize = "1"
